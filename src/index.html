<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio · Hussain Al Aradi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio of Hussain Al Aradi, software engineer: full-stack web and mobile projects, experience and CV.">
  <!-- Link previews (LinkedIn, WhatsApp, X, Slack). Preview images need absolute URLs.
       The image is rendered from scripts/og/og-image.html by scripts/og/render-og-image.mjs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hussain Al Aradi">
  <meta property="og:title" content="Hussain Al Aradi · Software Engineer">
  <meta property="og:description" content="Full-stack web and mobile projects with live demos, my experience, and a downloadable CV.">
  <meta property="og:url" content="https://hussainalaradi5.github.io/portfolio/">
  <meta property="og:image" content="https://hussainalaradi5.github.io/portfolio/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Hussain Al Aradi, Software Engineer, full-stack web and mobile">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2563eb">
  <!-- Applies the saved or system theme before Angular starts, so dark mode doesn't flash.
       The key must match THEME_STORAGE_KEY in src/app/constants/ui/theme.constants.ts. -->
  <script>
    try {
      var t = localStorage.getItem('portfolio-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
