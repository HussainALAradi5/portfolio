<div class="relative aspect-[16/10] overflow-hidden bg-muted">
  @if (cover(); as shot) {
    <img
      [src]="shot.src"
      [alt]="shot.caption"
      [attr.loading]="eager() ? 'eager' : 'lazy'"
      decoding="async"
      class="size-full object-cover object-top transition-transform duration-500 group-hover/card:scale-[1.03]"
    />
  } @else {
    <div class="cover-fallback grid size-full place-items-center">
      <div class="flex flex-col items-center gap-3 text-primary-foreground">
        <span class="grid size-16 place-items-center rounded-2xl bg-white/15 ring-1 ring-white/25 backdrop-blur">
          <ng-icon [name]="project().icon" size="32" />
        </span>
        <span class="text-lg font-semibold tracking-tight">{{ project().name }}</span>
      </div>
    </div>
  }
</div>
