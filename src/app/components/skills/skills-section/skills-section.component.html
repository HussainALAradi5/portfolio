<section class="mx-auto max-w-6xl px-4 pt-20 sm:px-6">
  <app-section-heading [heading]="text.skills.title" [subtitle]="text.skills.subtitle" />

  <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (group of groups; track group.id) {
      <article
        class="skill-group rounded-2xl border bg-card p-5 transition duration-300 hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-lg hover:shadow-primary/10 motion-reduce:transition-none motion-reduce:hover:translate-y-0"
        [class.is-core]="group.isCore"
      >
        <h3 class="flex items-center gap-3 font-semibold">
          <span class="group-icon grid size-9 place-items-center rounded-lg bg-primary/10 text-primary" aria-hidden="true">
            <ng-icon [name]="group.icon" size="18" />
          </span>
          {{ group.title }}
        </h3>
        <ul class="mt-4 flex flex-wrap gap-2">
          @for (skill of group.skills; track skill.name) {
            <li class="skill inline-flex items-center gap-1.5 rounded-lg border bg-background/60 px-3 py-1.5 text-sm font-medium">
              {{ skill.name }}
              @if (skill.note; as note) {
                <span class="text-xs font-normal text-muted-foreground">{{ note }}</span>
              }
            </li>
          }
        </ul>
      </article>
    }
  </div>
</section>
