<section class="mx-auto max-w-6xl px-4 pt-24 sm:px-6">
  <div class="contact-card relative overflow-hidden rounded-3xl border px-6 py-12 text-center sm:px-12 sm:py-16">
    <p class="text-sm font-medium tracking-[0.2em] text-primary uppercase">{{ text.contact.eyebrow }}</p>
    <h2 class="mt-3 text-3xl font-bold tracking-tight text-balance sm:text-4xl">{{ text.contact.title }}</h2>
    <p class="mx-auto mt-4 max-w-xl text-muted-foreground sm:text-lg">{{ text.contact.message }}</p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-2">
      <a hlmBtn size="lg" [href]="mailto">
        <ng-icon [name]="icon.send" data-icon="inline-start" />
        {{ text.contact.emailMe }}
      </a>
      <a hlmBtn variant="outline" size="lg" [href]="profile.linkedinUrl" target="_blank" rel="noopener">
        <ng-icon [name]="icon.linkedin" data-icon="inline-start" />
        {{ text.contact.linkedin }}
      </a>
      @if (showCv()) {
        <app-cv-download-button size="lg" />
      }
    </div>

    <div class="mt-6 flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm text-muted-foreground">
      <button
        type="button"
        class="copy-email inline-flex items-center gap-2 rounded-full border bg-background/60 px-3 py-1.5 transition-colors hover:border-primary/40 hover:text-foreground"
        [attr.aria-label]="text.contact.copyEmail"
        (click)="copyEmail()"
      >
        <span>{{ profile.email }}</span>
        @if (isCopied()) {
          <span class="inline-flex items-center gap-1 font-medium text-primary" role="status">
            <ng-icon [name]="icon.copied" size="14" />
            {{ text.contact.copied }}
          </span>
        } @else {
          <ng-icon [name]="icon.copy" size="14" />
        }
      </button>
      <span class="inline-flex items-center gap-1">
        <ng-icon [name]="icon.location" size="14" />
        {{ profile.location }}
      </span>
    </div>
  </div>
</section>
