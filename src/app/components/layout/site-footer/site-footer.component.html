<footer class="mt-24">
  <hlm-separator />
  <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 px-4 py-8 text-sm text-muted-foreground sm:flex-row sm:px-6">
    <p>&copy; {{ year }} {{ profile.name }}. {{ text.footer.builtWith }}</p>
    <div class="flex items-center gap-1">
      @for (link of profile.socialLinks; track link.url) {
        <a hlmBtn variant="ghost" size="icon-sm" [href]="link.url" target="_blank" rel="noopener" [attr.aria-label]="link.label">
          <ng-icon [name]="link.icon" />
        </a>
      }
    </div>
  </div>
</footer>
