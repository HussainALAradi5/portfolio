<header class="sticky top-0 z-40 border-b bg-background/80 backdrop-blur supports-[backdrop-filter]:bg-background/60">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
    <a [routerLink]="homePath" class="flex items-center gap-2 font-semibold tracking-tight">
      <span class="grid size-8 place-items-center rounded-lg bg-primary text-xs font-bold text-primary-foreground">
        {{ text.brand }}
      </span>
      <span class="hidden sm:inline">{{ profile.name }}</span>
    </a>

    <nav class="flex items-center gap-0.5 sm:gap-1">
      <button
        hlmBtn
        variant="outline"
        size="sm"
        type="button"
        class="search-trigger me-0.5 gap-2 px-2 text-muted-foreground sm:me-1 md:px-3"
        [attr.aria-label]="text.palette.openLabel"
        aria-haspopup="dialog"
        (click)="openPalette()"
      >
        <ng-icon [name]="icon.search" />
        <span class="hidden md:inline">{{ text.palette.open }}</span>
        <kbd class="hidden md:inline-grid">{{ shortcutLabel }}</kbd>
      </button>
      <a
        hlmBtn
        variant="ghost"
        size="sm"
        class="px-2 sm:px-3"
        [routerLink]="projectsPath"
        routerLinkActive="nav-active"
        ariaCurrentWhenActive="page"
      >
        {{ text.nav.projects }}
      </a>
      <a
        hlmBtn
        variant="ghost"
        size="sm"
        class="px-2 sm:px-3"
        [routerLink]="experiencePath"
        routerLinkActive="nav-active"
        ariaCurrentWhenActive="page"
      >
        {{ text.nav.experience }}
      </a>
      <a
        hlmBtn
        variant="ghost"
        size="sm"
        class="px-2 sm:px-3"
        [routerLink]="skillsPath"
        routerLinkActive="nav-active"
        ariaCurrentWhenActive="page"
      >
        {{ text.nav.skills }}
      </a>
      <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        type="button"
        [hlmTooltip]="text.nav.toggleTheme"
        [attr.aria-label]="text.nav.toggleTheme"
        (click)="toggleTheme()"
      >
        <ng-icon [name]="themeIcon()" />
      </button>
    </nav>
  </div>
</header>
