name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      # The site is served from https://<user>.github.io/<repo>/, so the base href is the repo name.
      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no rewrites: serving index.html as 404.html lets deep links like /projects/e-clinic load the app.
      - name: Single-page app fallback
        run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
