<!doctype html>
<!-- Link-preview card for LinkedIn, WhatsApp and X (1200x630).
     Regenerate public/og-image.png with: node scripts/og/render-og-image.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f8fafc;
    background:
      radial-gradient(55% 70% at 8% 0%, rgba(56, 189, 248, 0.35), transparent 70%),
      radial-gradient(50% 60% at 100% 100%, rgba(37, 99, 235, 0.45), transparent 70%),
      #0b1222;
    position: relative;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(148, 163, 184, 0.18) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(70% 80% at 30% 40%, black, transparent 80%);
  }
  .card { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 600; color: #cbd5e1; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; font-weight: 700; font-size: 28px;
  }
  h1 { margin: 0; font-size: 84px; line-height: 1.02; letter-spacing: -2px; }
  h1 span { background: linear-gradient(90deg, #60a5fa, #38bdf8); -webkit-background-clip: text; color: transparent; }
  .role { margin-top: 18px; font-size: 34px; color: #cbd5e1; font-weight: 500; }
  .stack { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    padding: 10px 20px; border-radius: 999px; font-size: 22px; font-weight: 600;
    background: rgba(59, 130, 246, 0.16); border: 1px solid rgba(96, 165, 250, 0.4); color: #bfdbfe;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 22px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="card">
    <div class="top">
      <div class="brand"><div class="logo">HA</div>Portfolio</div>
      <div class="url">hussainalaradi5.github.io/portfolio</div>
    </div>
    <div>
      <h1>Hussain <span>Al Aradi</span></h1>
      <div class="role">Software Engineer · Full-stack web &amp; mobile</div>
    </div>
    <div class="stack">
      <span class="chip">C# / ASP.NET</span>
      <span class="chip">Java / Spring Boot</span>
      <span class="chip">Next.js</span>
      <span class="chip">Angular</span>
      <span class="chip">Flutter</span>
    </div>
  </div>
</body>
</html>
