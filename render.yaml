services:
  - type: web
    name: hussain-portfolio
    runtime: static
    branch: master
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/portfolio/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # Single-page app: let Angular's router handle deep links such as /projects/e-clinic.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
